<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronización Somática - SRS</title>
    <!-- Tailwind CSS para diseño y utilidades -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #f4f0ea;
            --card-bg: #ffffff;
            --primary-color: #7b6ba8;
            --primary-dark: #5c4d8a;
            --text-color: #2c2c2c;
            --accent-color: #9d8ec4;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--primary-color);
            letter-spacing: 0.5px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #666666;
            margin-top: 0;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        /* Texto de instrucción sobre el contenedor */
        .instruction {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 15px;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s ease;
        }

        /* Contenedor del Cuadrado Visual */
        .box-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 10px auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 20px;
        }

        .box-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 220px;
            height: 220px;
            transform: rotate(-90deg);
            pointer-events: none;
            z-index: 2;
        }

        .box-bg {
            fill: none;
            stroke: #eeeeee;
            stroke-width: 8;
            stroke-linecap: round;
        }

        .box-progress {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 760;
            stroke-dashoffset: 760;
            transition: stroke 0.4s ease;
        }

        /* Representación interactiva de la Pelota Antiestrés en el centro */
        .center-graphic-wrapper {
            position: absolute;
            width: 160px;
            height: 160px;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stress-ball {
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .timer-info {
            font-size: 0.9rem;
            color: #777777;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(123, 107, 168, 0.2);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-skip {
            background-color: #a0a0a0;
            display: none;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>REGULACIÓN SOMÁTICA (SRS)</h1>
        <p class="subtitle">Técnica con Pelota Antiestrés</p>

        <!-- Texto de instrucción arriba del cuadro -->
        <div class="instruction" id="instructionText">Listo</div>

        <div class="box-container">
            <!-- Representación en SVG de la Pelota Somática en el centro -->
            <div class="center-graphic-wrapper">
                <svg class="stress-ball" id="stressBall" viewBox="0 0 100 100" fill="none">
                    <circle cx="50" cy="50" r="42" fill="url(#ballGradient)" />
                    <circle cx="50" cy="50" r="42" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
                    <!-- Brillo de la pelota -->
                    <ellipse cx="38" cy="35" rx="10" ry="6" fill="#ffffff" fill-opacity="0.25" transform="rotate(-30 38 35)"/>
                    <defs>
                        <radialGradient id="ballGradient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(35 32) rotate(50) scale(60)">
                            <stop stop-color="#9d8ec4"/>
                            <stop offset="0.7" stop-color="#7b6ba8"/>
                            <stop offset="1" stop-color="#5c4d8a"/>
                        </radialGradient>
                    </defs>
                </svg>
            </div>

            <!-- Trazo del Cuadrado Visual -->
            <svg class="box-svg" viewBox="0 0 220 220">
                <rect class="box-bg" x="15" y="15" width="190" height="190" rx="20"/>
                <rect id="boxProgress" class="box-progress" x="15" y="15" width="190" height="190" rx="20"/>
            </svg>
        </div>

        <div class="timer-info" id="statusText">Presiona Iniciar para comenzar</div>

        <button class="btn" id="startBtn" onclick="toggleExercise()">Iniciar Ejercicio</button>
        <button class="btn btn-skip" id="skipBtn" onclick="skipIntro()">Saltar Intro</button>
    </div>

    <script>
        // -------------------------------------------------------------
        // CARGA DE AUDIOS DESDE LA CARPETA EXACTA "Audios1/" DE GITHUB
        // -------------------------------------------------------------
        const bgMusic = new Audio('Audios1/Audio9.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.3;

        const voiceAudios = {
            intro: new Audio('Audios1/Audio1.mp3'),    // Explicación teórica de la técnica SRS
            exercise: new Audio('Audios1/Audio2.mp3')  // Guía práctica: Aprieta, Inhala, Sostén, Exhala, Libera
        };

        let isRunning = false;
        let isIntroPhase = false;
        let currentVoiceAudio = null;
        let animationFrameId = null;

        const instructionText = document.getElementById('instructionText');
        const statusText = document.getElementById('statusText');
        const startBtn = document.getElementById('startBtn');
        const skipBtn = document.getElementById('skipBtn');
        const boxProgress = document.getElementById('boxProgress');
        const stressBall = document.getElementById('stressBall');

        const TOTAL_PERIMETER = 760;
        boxProgress.style.strokeDasharray = TOTAL_PERIMETER;
        boxProgress.style.strokeDashoffset = TOTAL_PERIMETER;

        function toggleExercise() {
            if (isRunning) {
                stopExercise();
            } else {
                startExercise();
            }
        }

        function startExercise() {
            isRunning = true;
            isIntroPhase = true;
            startBtn.textContent = 'Detener';
            startBtn.style.backgroundColor = '#d9534f';
            skipBtn.style.display = 'block';

            // Iniciar música de fondo ambiental
            bgMusic.currentTime = 0;
            bgMusic.play().catch(err => console.warn("La reproducción automática de música fue bloqueada:", err));

            // Fase 1: Audio 1 (Introducción Teórica SRS)
            instructionText.textContent = "Introducción Somática";
            statusText.textContent = "Escuchando teoría SRS...";
            
            playVoiceAudio(voiceAudios.intro, () => {
                // Al terminar Audio 1, pasar automáticamente al Audio 2
                startPracticalExercise();
            });
        }

        function playVoiceAudio(audioObj, onEndedCallback) {
            if (!isRunning) return;

            currentVoiceAudio = audioObj;
            currentVoiceAudio.currentTime = 0;

            currentVoiceAudio.play().catch(err => {
                console.warn("Error reproduciendo voz:", err);
                if (isRunning && onEndedCallback) onEndedCallback();
            });

            currentVoiceAudio.onended = () => {
                if (isRunning && onEndedCallback) {
                    onEndedCallback();
                }
            };
        }

        function skipIntro() {
            if (!isRunning) return;

            if (currentVoiceAudio) {
                currentVoiceAudio.pause();
                currentVoiceAudio.currentTime = 0;
                currentVoiceAudio.onended = null;
            }
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            startPracticalExercise();
        }

        function startPracticalExercise() {
            isIntroPhase = false;
            skipBtn.style.display = 'none';
            statusText.textContent = "Sigue la voz y la guía visual";

            currentVoiceAudio = voiceAudios.exercise;
            currentVoiceAudio.currentTime = 0;

            currentVoiceAudio.play().catch(err => console.warn("Error en audio práctico:", err));

            currentVoiceAudio.onended = () => {
                if (isRunning) {
                    instructionText.textContent = "¡Completado!";
                    statusText.textContent = "Calma y regulación activadas";
                    setTimeout(stopExercise, 3000);
                }
            };

            // Iniciar animación sincronizada en tiempo real con Audio2
            syncExerciseAnimation();
        }

        function syncExerciseAnimation() {
            if (!isRunning || isIntroPhase || currentVoiceAudio !== voiceAudios.exercise) return;

            const t = voiceAudios.exercise.currentTime;
            const duration = (voiceAudios.exercise.duration && !isNaN(voiceAudios.exercise.duration) && voiceAudios.exercise.duration > 0)
                             ? voiceAudios.exercise.duration 
                             : 90;

            // Avance del marco externo progresivo
            const globalProgress = Math.min(1, Math.max(0, t / duration));
            boxProgress.style.strokeDashoffset = TOTAL_PERIMETER - (globalProgress * TOTAL_PERIMETER);

            // Ciclo somático de 16 segundos (4s Presiona/Inhala, 4s Sostén, 4s Exhala/Libera, 4s Descanso)
            const cycleDuration = 16;
            const phaseTime = t % cycleDuration;
            const phase = Math.floor((phaseTime / cycleDuration) * 4);

            if (phase === 0) {
                instructionText.textContent = "Inhala y Aprieta";
                stressBall.style.transform = "scale(0.75)"; // Se comprime la pelota
                boxProgress.style.stroke = "var(--primary-color)";
            } else if (phase === 1) {
                instructionText.textContent = "Sostén";
                stressBall.style.transform = "scale(0.70)"; // Mantener presión máxima
                boxProgress.style.stroke = "var(--primary-dark)";
            } else if (phase === 2) {
                instructionText.textContent = "Exhala y Libera";
                stressBall.style.transform = "scale(0.92)"; // Soltar presión paulatinamente
                boxProgress.style.stroke = "var(--accent-color)";
            } else if (phase === 3) {
                instructionText.textContent = "Vacío / Calma";
                stressBall.style.transform = "scale(1.0)"; // Estado relajado
                boxProgress.style.stroke = "#b8b0d3";
            }

            if (!voiceAudios.exercise.paused && !voiceAudios.exercise.ended && isRunning) {
                animationFrameId = requestAnimationFrame(syncExerciseAnimation);
            }
        }

        function stopExercise() {
            isRunning = false;
            isIntroPhase = false;

            bgMusic.pause();
            bgMusic.currentTime = 0;

            if (currentVoiceAudio) {
                currentVoiceAudio.pause();
                currentVoiceAudio.currentTime = 0;
                currentVoiceAudio.onended = null;
            }
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            // Restablecer valores originales
            boxProgress.style.strokeDashoffset = TOTAL_PERIMETER;
            boxProgress.style.stroke = "var(--primary-color)";
            stressBall.style.transform = "scale(1.0)";

            instructionText.textContent = 'Listo';
            statusText.textContent = 'Presiona Iniciar para comenzar';
            startBtn.textContent = 'Iniciar Ejercicio';
            startBtn.style.backgroundColor = 'var(--primary-color)';
            skipBtn.style.display = 'none';
        }
    </script>
</body>
</html>
