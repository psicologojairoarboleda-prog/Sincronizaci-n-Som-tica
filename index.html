<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regulación Somática (SRS)</title>
    <style>
        :root {
            --bg-color: #f2f5f8;
            --card-bg: #ffffff;
            --primary-color: #3a6073;
            --accent-color: #d9534f;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 28px;
            padding: 35px 25px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
        }

        h1 {
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            margin-top: 0;
            margin-bottom: 4px;
            color: var(--primary-color);
            text-transform: uppercase;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 0;
            margin-bottom: 20px;
        }

        .instruction-box {
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .instruction {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--primary-color);
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Contenedor central adaptable */
        .visual-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 15px auto 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Pelota Somática (Activa durante el ejercicio) */
        .somatic-ball {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #7ca1b5, #3a6073 70%, #162c38);
            box-shadow: 0 10px 25px rgba(58, 96, 115, 0.25);
            transform: scale(1);
            will-change: transform;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* Ondas Relajantes (Activas en intro y cierre) */
        .waves-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .wave {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(58, 96, 115, 0.3);
            animation: ripple 3s infinite linear;
        }

        .wave:nth-child(2) {
            animation-delay: 1.5s;
        }

        @keyframes ripple {
            0% {
                width: 60px;
                height: 60px;
                opacity: 0.8;
            }
            100% {
                width: 200px;
                height: 200px;
                opacity: 0;
            }
        }

        /* Clases de estado visual */
        .mode-waves .waves-container { opacity: 1; }
        .mode-waves .somatic-ball { opacity: 0; pointer-events: none; }

        .mode-ball .waves-container { opacity: 0; pointer-events: none; }
        .mode-ball .somatic-ball { opacity: 1; }

        .progress-bar-container {
            width: 100%;
            height: 5px;
            background-color: #e2e8f0;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(58, 96, 115, 0.2);
        }

        .btn:hover {
            opacity: 0.92;
        }

        .btn-stop {
            background-color: var(--accent-color) !important;
            box-shadow: 0 4px 12px rgba(217, 83, 79, 0.2) !important;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-sub);
            border: 1px solid #cbd5e1;
            box-shadow: none;
            display: none;
        }

        .btn-secondary:hover {
            background-color: #f8fafc;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Regulación Somática</h1>
        <p class="subtitle">Práctica Guiada SRS</p>

        <div class="instruction-box">
            <div class="instruction" id="instructionText"></div>
        </div>

        <div class="visual-wrapper mode-waves" id=" visualWrapper">
            <div class="waves-container">
                <div class="wave"></div>
                <div class="wave"></div>
            </div>
            <div class="somatic-ball" id="somaticBall"></div>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="btn-group">
            <button class="btn" id="startBtn" onclick="toggleExercise()">Iniciar Ejercicio</button>
            <button class="btn btn-secondary" id="skipBtn" onclick="skipIntro()">Saltar Explicación Teórica</button>
        </div>
    </div>

    <script>
        const bgMusic = new Audio('Audios1/Audio9.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.2;

        const voiceAudios = {
            intro: new Audio('Audios1/Audio1.mp3'),
            practice: new Audio('Audios1/Audio2.mp3')
        };

        let isRunning = false;
        let currentAudio = null;
        let animationFrameId = null;

        const instructionText = document.getElementById('instructionText');
        const visualWrapper = document.getElementById('visualWrapper');
        const somaticBall = document.getElementById('somaticBall');
        const progressBar = document.getElementById('progressBar');
        const startBtn = document.getElementById('startBtn');
        const skipBtn = document.getElementById('skipBtn');

        /* 
          LÍNEA DE TIEMPO ESTRICTA Y CALIBRADA CON EL ANÁLISIS DEL AUDIO 2:
          - visual: "waves" (ondas relajantes activas, sin pelota ni texto durante la intro/cierre) o "ball" (pelota y órdenes activas).
        */
        const TIMELINE = [
            // 0s a 13s: Introducción hablada pura ("Toma la pelota...", posturas, atención) -> Ondas relajantes sin texto
            { start: 0.0,  end: 13.0, title: "", visual: "waves", action: "static", scale: 1.0 },
            
            // 1er Ciclo de Presión
            { start: 13.0, end: 20.0, title: "Inhala y Aprieta", visual: "ball", action: "squeeze", scaleStart: 1.0, scaleEnd: 0.6 },
            { start: 20.0, end: 22.5, title: "Sostén", visual: "ball", action: "hold", scale: 0.6 },
            { start: 22.5, end: 29.0, title: "Exhala y Libera", visual: "ball", action: "release", scaleStart: 0.6, scaleEnd: 1.0 },

            { start: 29.0, end: 32.5, title: "", visual: "ball", action: "static", scale: 1.0 },

            // 2do Ciclo de Presión (con retención larga de hombros y antebrazo)
            { start: 32.5, end: 39.5, title: "Inhala y Aprieta", visual: "ball", action: "squeeze", scaleStart: 1.0, scaleEnd: 0.6 },
            { start: 39.5, end: 49.0, title: "Sostén", visual: "ball", action: "hold", scale: 0.6 },
            { start: 49.0, end: 56.5, title: "Exhala y Libera", visual: "ball", action: "release", scaleStart: 0.6, scaleEnd: 1.0 },

            { start: 56.5, end: 59.5, title: "", visual: "ball", action: "static", scale: 1.0 },

            // 3er Ciclo de Presión ("Vuelves a apretar...")
            { start: 59.5, end: 66.5, title: "Inhala y Aprieta", visual: "ball", action: "squeeze", scaleStart: 1.0, scaleEnd: 0.6 },
            { start: 66.5, end: 71.0, title: "Sostén", visual: "ball", action: "hold", scale: 0.6 },
            { start: 71.0, end: 78.5, title: "Exhala y Libera", visual: "ball", action: "release", scaleStart: 0.6, scaleEnd: 1.0 },

            // 78.5s en adelante: Fase pasiva, sensaciones corporales, calor, rodar pelota entre palmas y cierre de voz conversacional -> Ondas relajantes sin pelota ni texto forzado
            { start: 78.5, end: 180.0, title: "", visual: "waves", action: "static", scale: 1.0 }
        ];

        function toggleExercise() {
            if (isRunning) {
                stopExercise();
            } else {
                startExercise();
            }
        }

        function startExercise() {
            isRunning = true;
            startBtn.textContent = 'Detener Ejercicio';
            startBtn.classList.add('btn-stop');
            skipBtn.style.display = 'block';

            bgMusic.currentTime = 0;
            bgMusic.play().catch(e => console.warn(e));

            playAudioSequence(voiceAudios.intro, "", () => {
                startPractice();
            });
        }

        function skipIntro() {
            if (!isRunning) return;
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.onended = null;
            }
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            startPractice();
        }

        function playAudioSequence(audioObj, title, onEndedCallback) {
            if (!isRunning) return;

            currentAudio = audioObj;
            currentAudio.currentTime = 0;
            instructionText.textContent = title;
            visualWrapper.className = "visual-wrapper mode-waves";
            somaticBall.style.transform = "scale(1)";

            currentAudio.play().catch(e => console.warn(e));

            function updateProgress() {
                if (!isRunning || currentAudio !== audioObj) return;
                if (currentAudio.duration && currentAudio.duration > 0) {
                    progressBar.style.width = ((currentAudio.currentTime / currentAudio.duration) * 100) + "%";
                }
                if (!currentAudio.paused && !currentAudio.ended) {
                    animationFrameId = requestAnimationFrame(updateProgress);
                }
            }
            animationFrameId = requestAnimationFrame(updateProgress);

            currentAudio.onended = () => {
                if (isRunning && onEndedCallback) onEndedCallback();
            };
        }

        function startPractice() {
            skipBtn.style.display = 'none';
            currentAudio = voiceAudios.practice;
            currentAudio.currentTime = 0;

            currentAudio.play().catch(e => console.warn(e));

            function animatePractice() {
                if (!isRunning || currentAudio !== voiceAudios.practice) return;

                const t = currentAudio.currentTime;

                if (currentAudio.duration && currentAudio.duration > 0) {
                    progressBar.style.width = ((t / currentAudio.duration) * 100) + "%";
                }

                const step = TIMELINE.find(s => t >= s.start && t < s.end) || TIMELINE[TIMELINE.length - 1];

                instructionText.textContent = step.title;

                // Controlar si se muestran ondas relajantes o la pelota somática activa
                if (step.visual === "waves") {
                    visualWrapper.className = "visual-wrapper mode-waves";
                } else {
                    visualWrapper.className = "visual-wrapper mode-ball";
                }

                let currentScale = 1.0;

                if (step.action === "static" || step.action === "hold") {
                    currentScale = step.scale;
                } else if (step.action === "squeeze" || step.action === "release") {
                    const duration = step.end - step.start;
                    const elapsed = Math.max(0, Math.min(duration, t - step.start));
                    const progress = elapsed / duration;
                    
                    currentScale = step.scaleStart + (step.scaleEnd - step.scaleStart) * progress;
                }

                somaticBall.style.transform = `scale(${currentScale.toFixed(3)})`;

                if (!currentAudio.paused && !currentAudio.ended) {
                    animationFrameId = requestAnimationFrame(animatePractice);
                }
            }

            currentAudio.onplay = () => {
                animationFrameId = requestAnimationFrame(animatePractice);
            };

            currentAudio.onended = () => {
                if (isRunning) {
                    instructionText.textContent = "";
                    visualWrapper.className = "visual-wrapper mode-waves";
                    somaticBall.style.transform = "scale(1)";
                    setTimeout(stopExercise, 2000);
                }
            };
        }

        function stopExercise() {
            isRunning = false;

            bgMusic.pause();
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio.onended = null;
            }

            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            progressBar.style.width = "0%";
            visualWrapper.className = "visual-wrapper mode-waves";
            somaticBall.style.transform = "scale(1)";
            instructionText.textContent = "";
            startBtn.textContent = 'Iniciar Ejercicio';
            startBtn.classList.remove('btn-stop');
            skipBtn.style.display = 'none';
        }
    </script>
</body>
</html>
