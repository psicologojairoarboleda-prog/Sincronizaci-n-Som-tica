<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronización Somática - SRS</title>
    <!-- Tailwind CSS para utilidades complementarias -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #f2f5f8;
            --card-bg: #ffffff;
            --primary-color: #5b7c99;
            --primary-accent: #3b5975;
            --text-color: #2b3a4a;
            --highlight-color: #7da5c9;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container-card {
            background-color: var(--card-bg);
            border-radius: 28px;
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 30px rgba(59, 89, 117, 0.08);
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--primary-accent);
            letter-spacing: 0.5px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 0;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        /* Texto de instrucción ubicado arriba del cuadro */
        .instruction {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-accent);
            margin-bottom: 15px;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Contenedor del Cuadrado de Respiración Somática */
        .box-container {
            position: relative;
            width: 230px;
            height: 230px;
            margin: 10px auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 24px;
            background: radial-gradient(circle, rgba(125,165,201,0.08) 0%, rgba(255,255,255,0) 70%);
        }

        .box-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 230px;
            height: 230px;
            transform: rotate(-90deg);
            pointer-events: none;
            z-index: 2;
        }

        .box-bg {
            fill: none;
            stroke: #e2e8f0;
            stroke-width: 8;
            stroke-linecap: round;
        }

        .box-progress {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 800;
            stroke-dashoffset: 800;
            transition: stroke 0.4s ease;
        }

        /* Ilustración / Gráfico Central Integrado */
        .center-graphic-container {
            position: absolute;
            width: 170px;
            height: 170px;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .center-graphic {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            mix-blend-mode: multiply;
            opacity: 0.9;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 75%);
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 75%);
        }

        /* Indicador de fase somática en el centro */
        .somatic-indicator {
            position: absolute;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #475569;
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 12px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            z-index: 3;
            pointer-events: none;
        }

        .timer-info {
            font-size: 0.9rem;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(91, 124, 153, 0.25);
            margin-top: 8px;
        }

        .btn:hover {
            background-color: var(--primary-accent);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(1px) scale(0.98);
        }

        .btn-skip {
            background-color: #94a3b8;
            box-shadow: none;
            display: none;
            margin-top: 10px;
        }

        .btn-skip:hover {
            background-color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container-card">
        <h1>SINCRONIZACIÓN SOMÁTICA</h1>
        <p class="subtitle">Tríada de Respiración, Presión y Liberación (SRS)</p>

        <!-- Texto de instrucción arriba del cuadro -->
        <div class="instruction" id="instructionText">Listo para iniciar</div>

        <div class="box-container">
            <!-- Icono / Gráfico SVG Integrado para la Pelota Somática -->
            <div class="center-graphic-container" id="graphicWrapper">
                <svg class="center-graphic" id="ballGraphic" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="100" cy="100" r="75" fill="url(#paint0_radial)" />
                    <circle cx="100" cy="100" r="75" stroke="#7da5c9" stroke-width="2" stroke-opacity="0.4" />
                    <!-- Textura táctil / Puntos de presión estéticos -->
                    <circle cx="80" cy="70" r="4" fill="#ffffff" fill-opacity="0.5"/>
                    <circle cx="120" cy="85" r="3" fill="#ffffff" fill-opacity="0.4"/>
                    <circle cx="95" cy="125" r="5" fill="#ffffff" fill-opacity="0.3"/>
                    <defs>
                        <radialGradient id="paint0_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(75 65) rotate(55) scale(110)">
                            <stop stop-color="#9bbad6"/>
                            <stop offset="0.6" stop-color="#5b7c99"/>
                            <stop offset="1" stop-color="#3b5975"/>
                        </radialGradient>
                    </defs>
                </svg>
            </div>

            <div class="somatic-indicator" id="somaticIndicator">Esperando</div>

            <!-- SVG del Cuadrado de Progreso -->
            <svg class="box-svg" viewBox="0 0 230 230">
                <rect class="box-bg" x="15" y="15" width="200" height="200" rx="22"/>
                <rect id="boxProgress" class="box-progress" x="15" y="15" width="200" height="200" rx="22"/>
            </svg>
        </div>

        <div class="timer-info" id="statusText">Fase: Preparación</div>

        <button class="btn" id="startBtn" onclick="toggleExercise()">Iniciar Ejercicio</button>
        <button class="btn btn-skip" id="skipBtn" onclick="skipIntro()">Saltar Explicación</button>
    </div>

    <script>
        // Audio de fondo ambiental (Opcional, si existe en la carpeta Audios)
        const bgMusic = new Audio('Audios/Audio9.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.25;

        // Audios de voz SRS adaptados a la estructura provista
        const voiceAudios = {
            intro: new Audio('Audios/Audio1.mp3'),      // Explicación de la técnica y descarga somática
            guided: new Audio('Audios/Audio2.mp3')       // Ejercicio Guiado completo (Presión, Inhalar, Sostener, Exhalar, Libera)
        };

        let isRunning = false;
        let isIntroPhase = false;
        let currentVoiceAudio = null;
        let animationFrameId = null;

        const instructionText = document.getElementById('instructionText');
        const statusText = document.getElementById('statusText');
        const somaticIndicator = document.getElementById('somaticIndicator');
        const startBtn = document.getElementById('startBtn');
        const skipBtn = document.getElementById('skipBtn');
        const boxProgress = document.getElementById('boxProgress');
        const ballGraphic = document.getElementById('ballGraphic');

        // Perímetro del rectángulo SVG: (width 200 + height 200) * 2 = 800
        const TOTAL_PERIMETER = 800;
        boxProgress.style.strokeDasharray = TOTAL_PERIMETER;
        boxProgress.style.strokeDashoffset = TOTAL_PERIMETER;

        function toggleExercise() {
            if (isRunning) {
                stopExercise();
            } else {
                startExercise();
            }
        }

        function playAudio(audioObj, onEndedCallback) {
            if (!isRunning) return;

            currentVoiceAudio = audioObj;
            currentVoiceAudio.currentTime = 0;

            currentVoiceAudio.play().catch(err => {
                console.warn("Error al reproducir audio:", err);
                if (isRunning && onEndedCallback) onEndedCallback();
            });

            currentVoiceAudio.onended = () => {
                if (isRunning && onEndedCallback) {
                    onEndedCallback();
                }
            };
        }

        function startExercise() {
            isRunning = true;
            isIntroPhase = true;
            startBtn.textContent = 'Detener';
            startBtn.style.backgroundColor = '#e53e3e';
            skipBtn.style.display = 'block';

            // Iniciar música ambiental si está disponible
            bgMusic.currentTime = 0;
            bgMusic.play().catch(err => console.warn("Música de fondo no iniciada:", err));

            // Paso 1: Reproducir Audio 1 (Introducción Teórica SRS)
            instructionText.textContent = "Introducción Teórica SRS";
            statusText.textContent = "Escuchando fundamentación...";
            somaticIndicator.textContent = "Teoría";

            playAudio(voiceAudios.intro, () => {
                // Al finalizar la intro, inicia el ejercicio guiado
                startGuidedSession();
            });
        }

        function skipIntro() {
            if (!isRunning) return;

            if (currentVoiceAudio) {
                currentVoiceAudio.pause();
                currentVoiceAudio.currentTime = 0;
                currentVoiceAudio.onended = null;
            }
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            startGuidedSession();
        }

        function startGuidedSession() {
            isIntroPhase = false;
            skipBtn.style.display = 'none';
            statusText.textContent = "Ejercicio Somático Activo";
            somaticIndicator.textContent = "En curso";

            // Reproducir Audio 2 (Guiado) y sincronizar la animación visual
            currentVoiceAudio = voiceAudios.guided;
            currentVoiceAudio.currentTime = 0;

            currentVoiceAudio.play().catch(err => console.warn("Error reproduciendo guiado:", err));

            currentVoiceAudio.onended = () => {
                if (isRunning) {
                    instructionText.textContent = "¡Regulación Somática Completada!";
                    statusText.textContent = "Estado de calma alcanzado";
                    somaticIndicator.textContent = "Completado";
                    setTimeout(stopExercise, 3000);
                }
            };

            // Iniciar ciclo de sincronización en tiempo real con el audio guiado
            syncGuidedAnimation();
        }

        function syncGuidedAnimation() {
            if (!isRunning || isIntroPhase || currentVoiceAudio !== voiceAudios.guided) return;

            const t = voiceAudios.guided.currentTime;
            const duration = (voiceAudios.guided.duration && !isNaN(voiceAudios.guided.duration) && voiceAudios.guided.duration > 0)
                             ? voiceAudios.guided.duration 
                             : 60; // Fallback

            // Porcentaje global del audio guiado (0 a 1)
            const globalProgress = Math.min(1, Math.max(0, t / duration));

            // Actualizar marco de progreso del cuadrado SVG
            const strokeOffset = TOTAL_PERIMETER - (globalProgress * TOTAL_PERIMETER);
            boxProgress.style.strokeDashoffset = strokeOffset;

            // Secuencia cíclica de 4 fases somáticas (cada ciclo dura 16 segundos: 4s Presión/Inhala, 4s Sostén, 4s Exhala, 4s Libera)
            const cycleDuration = 16;
            const cycleTime = t % cycleDuration;
            const phase = Math.floor((cycleTime / cycleDuration) * 4);

            if (phase === 0) {
                instructionText.textContent = "Presiona e Inhala";
                somaticIndicator.textContent = "Presión";
                ballGraphic.style.transform = "scale(0.82)"; // Se comprime la pelota
                boxProgress.style.stroke = "#5b7c99";
            } else if (phase === 1) {
                instructionText.textContent = "Sostén la Tensión";
                somaticIndicator.textContent = "Sostén";
                ballGraphic.style.transform = "scale(0.80)"; // Máxima tensión
                boxProgress.style.stroke = "#3b5975";
            } else if (phase === 2) {
                instructionText.textContent = "Exhala y Libera Suave";
                somaticIndicator.textContent = "Liberación";
                ballGraphic.style.transform = "scale(0.95)"; // Se empieza a expandir
                boxProgress.style.stroke = "#7da5c9";
            } else if (phase === 3) {
                instructionText.textContent = "Descanso y Calma";
                somaticIndicator.textContent = "Relajación";
                ballGraphic.style.transform = "scale(1.0)"; // Estado expandido/relajado
                boxProgress.style.stroke = "#a0aec0";
            }

            if (!voiceAudios.guided.paused && !voiceAudios.guided.ended && isRunning) {
                animationFrameId = requestAnimationFrame(syncGuidedAnimation);
            }
        }

        function stopExercise() {
            isRunning = false;
            isIntroPhase = false;

            bgMusic.pause();
            bgMusic.currentTime = 0;

            if (currentVoiceAudio) {
                currentVoiceAudio.pause();
                currentVoiceAudio.currentTime = 0;
                currentVoiceAudio.onended = null;
            }
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            // Restablecer interfaz visual
            boxProgress.style.strokeDashoffset = TOTAL_PERIMETER;
            boxProgress.style.stroke = "var(--primary-color)";
            ballGraphic.style.transform = "scale(1)";

            instructionText.textContent = 'Listo para iniciar';
            statusText.textContent = 'Fase: Preparación';
            somaticIndicator.textContent = 'Esperando';

            startBtn.textContent = 'Iniciar Ejercicio';
            startBtn.style.backgroundColor = 'var(--primary-color)';
            skipBtn.style.display = 'none';
        }
    </script>
</body>
</html>
