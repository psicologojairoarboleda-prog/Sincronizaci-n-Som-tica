<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regulación Somática (SRS)</title>
    <style>
        :root {
            --bg-color: #f2f5f8;
            --card-bg: #ffffff;
            --primary-color: #3a6073;
            --accent-color: #d9534f;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 28px;
            padding: 35px 25px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
        }

        h1 {
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            margin-top: 0;
            margin-bottom: 4px;
            color: var(--primary-color);
            text-transform: uppercase;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 0;
            margin-bottom: 20px;
        }

        .instruction-box {
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .instruction {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-color);
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ball-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 15px auto 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .somatic-ball {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #7ca1b5, #3a6073 70%, #162c38);
            box-shadow: 0 10px 25px rgba(58, 96, 115, 0.25);
            transform: scale(1);
            will-change: transform;
        }

        .progress-bar-container {
            width: 100%;
            height: 5px;
            background-color: #e2e8f0;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(58, 96, 115, 0.2);
        }

        .btn:hover {
            opacity: 0.92;
        }

        .btn-stop {
            background-color: var(--accent-color) !important;
            box-shadow: 0 4px 12px rgba(217, 83, 79, 0.2) !important;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-sub);
            border: 1px solid #cbd5e1;
            box-shadow: none;
            display: none;
        }

        .btn-secondary:hover {
            background-color: #f8fafc;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Regulación Somática</h1>
        <p class="subtitle">Práctica Guiada SRS</p>

        <div class="instruction-box">
            <div class="instruction" id="instructionText">Listo para iniciar</div>
        </div>

        <div class="ball-wrapper">
            <div class="somatic-ball" id="somaticBall"></div>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="btn-group">
            <button class="btn" id="startBtn" onclick="toggleExercise()">Iniciar Ejercicio</button>
            <button class="btn btn-secondary" id="skipBtn" onclick="skipIntro()">Saltar Explicación Teórica</button>
        </div>
    </div>

    <script>
        const bgMusic = new Audio('Audios1/Audio9.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.2;

        const voiceAudios = {
            intro: new Audio('Audios1/Audio1.mp3'),
            practice: new Audio('Audios1/Audio2.mp3')
        };

        let isRunning = false;
        let currentAudio = null;
        let animationFrameId = null;

        const instructionText = document.getElementById('instructionText');
        const somaticBall = document.getElementById('somaticBall');
        const progressBar = document.getElementById('progressBar');
        const startBtn = document.getElementById('startBtn');
        const skipBtn = document.getElementById('skipBtn');

        /* 
          LÍNEA DE TIEMPO ESTRICTA (AUDIO 2)
          Calibrada de forma directa con las locuciones exactas de inhalación, sostén y exhalación.
        */
        const TIMELINE = [
            { start: 0.0,  end: 9.5,   title: "Prepárate", action: "static", scale: 1.0 },
            
            // Ciclo 1
            { start: 9.5,  end: 16.5,  title: "Inhala y Aprieta", action: "squeeze", scaleStart: 1.0, scaleEnd: 0.6 },
            { start: 16.5, end: 19.5,  title: "Sostén", action: "hold", scale: 0.6 },
            { start: 19.5, end: 28.0,  title: "Exhala y Libera", action: "release", scaleStart: 0.6, scaleEnd: 1.0 },

            // Ciclo 2
            { start: 28.0, end: 35.0,  title: "Inhala y Aprieta", action: "squeeze", scaleStart: 1.0, scaleEnd: 0.6 },
            { start: 35.0, end: 45.0,  title: "Sostén", action: "hold", scale: 0.6 },
            { start: 45.0, end: 54.0,  title: "Exhala y Libera", action: "release", scaleStart: 0.6, scaleEnd: 1.0 },

            // Ciclo 3
            { start: 54.0, end: 61.0,  title: "Inhala y Aprieta", action: "squeeze", scaleStart: 1.0, scaleEnd: 0.6 },
            { start: 61.0, end: 68.0,  title: "Sostén", action: "hold", scale: 0.6 },
            { start: 68.0, end: 77.0,  title: "Exhala y Libera", action: "release", scaleStart: 0.6, scaleEnd: 1.0 },

            // Transición y descanso pasivo
            { start: 77.0, end: 128.0, title: "Respiración Suave", action: "static", scale: 1.0 },

            // Cierre final
            { start: 128.0, end: 134.0, title: "Inhala", action: "squeeze", scaleStart: 1.0, scaleEnd: 0.7 },
            { start: 134.0, end: 138.0, title: "Sostén", action: "hold", scale: 0.7 },
            { start: 138.0, end: 147.0, title: "Exhala y Libera", action: "release", scaleStart: 0.7, scaleEnd: 1.0 },
            { start: 147.0, end: 160.0, title: "Calma Completada", action: "static", scale: 1.0 }
        ];

        function toggleExercise() {
            if (isRunning) {
                stopExercise();
            } else {
                startExercise();
            }
        }

        function startExercise() {
            isRunning = true;
            startBtn.textContent = 'Detener Ejercicio';
            startBtn.classList.add('btn-stop');
            skipBtn.style.display = 'block';

            bgMusic.currentTime = 0;
            bgMusic.play().catch(e => console.warn(e));

            playAudioSequence(voiceAudios.intro, "Explicación Teórica", () => {
                startPractice();
            });
        }

        function skipIntro() {
            if (!isRunning) return;
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.onended = null;
            }
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            startPractice();
        }

        function playAudioSequence(audioObj, title, onEndedCallback) {
            if (!isRunning) return;

            currentAudio = audioObj;
            currentAudio.currentTime = 0;
            instructionText.textContent = title;
            somaticBall.style.transform = "scale(1)";

            currentAudio.play().catch(e => console.warn(e));

            function updateProgress() {
                if (!isRunning || currentAudio !== audioObj) return;
                if (currentAudio.duration) {
                    progressBar.style.width = ((currentAudio.currentTime / currentAudio.duration) * 100) + "%";
                }
                if (!currentAudio.paused && !currentAudio.ended) {
                    animationFrameId = requestAnimationFrame(updateProgress);
                }
            }
            animationFrameId = requestAnimationFrame(updateProgress);

            currentAudio.onended = () => {
                if (isRunning && onEndedCallback) onEndedCallback();
            };
        }

        function startPractice() {
            skipBtn.style.display = 'none';
            currentAudio = voiceAudios.practice;
            currentAudio.currentTime = 0;

            currentAudio.play().catch(e => console.warn(e));

            function animatePractice() {
                if (!isRunning || currentAudio !== voiceAudios.practice) return;

                const t = currentAudio.currentTime;

                if (currentAudio.duration) {
                    progressBar.style.width = ((t / currentAudio.duration) * 100) + "%";
                }

                // Identificar el segmento exacto según el segundo transcurrido
                const step = TIMELINE.find(s => t >= s.start && t < s.end) || TIMELINE[TIMELINE.length - 1];

                instructionText.textContent = step.title;

                let currentScale = 1.0;

                if (step.action === "static" || step.action === "hold") {
                    currentScale = step.scale;
                } else if (step.action === "squeeze" || step.action === "release") {
                    // Interpolación lineal de precisión para garantizar una compresión/expansión gradual sin saltos
                    const duration = step.end - step.start;
                    const elapsed = Math.max(0, Math.min(duration, t - step.start));
                    const progress = elapsed / duration;
                    
                    currentScale = step.scaleStart + (step.scaleEnd - step.scaleStart) * progress;
                }

                somaticBall.style.transform = `scale(${currentScale.toFixed(3)})`;

                if (!currentAudio.paused && !currentAudio.ended) {
                    animationFrameId = requestAnimationFrame(animatePractice);
                }
            }

            currentAudio.onplay = () => {
                animationFrameId = requestAnimationFrame(animatePractice);
            };

            currentAudio.onended = () => {
                if (isRunning) {
                    instructionText.textContent = "Calma Restaurada";
                    somaticBall.style.transform = "scale(1)";
                    setTimeout(stopExercise, 3000);
                }
            };
        }

        function stopExercise() {
            isRunning = false;

            bgMusic.pause();
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio.onended = null;
            }

            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            progressBar.style.width = "0%";
            somaticBall.style.transform = "scale(1)";
            instructionText.textContent = "Listo para iniciar";
            startBtn.textContent = 'Iniciar Ejercicio';
            startBtn.classList.remove('btn-stop');
            skipBtn.style.display = 'none';
        }
    </script>
</body>
</html>
