<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regulación Somática (SRS)</title>
    <style>
        :root {
            --bg-color: #f2f5f8;
            --card-bg: #ffffff;
            --primary-color: #3a6073;
            --accent-color: #d9534f;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 28px;
            padding: 35px 25px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
        }

        h1 {
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            margin-top: 0;
            margin-bottom: 4px;
            color: var(--primary-color);
            text-transform: uppercase;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Área de Instrucción */
        .instruction-box {
            min-height: 75px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .instruction {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--primary-color);
            line-height: 1.2;
        }

        .sub-instruction {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-top: 6px;
            font-style: italic;
        }

        /* ÁREA DE LA PELOTA SOMÁTICA */
        .ball-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 10px auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .somatic-ball {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #7ca1b5, #3a6073 70%, #162c38);
            box-shadow: 0 10px 25px rgba(58, 96, 115, 0.25);
            transform: scale(1);
            will-change: transform, filter;
        }

        /* Barra de progreso de audio */
        .progress-bar-container {
            width: 100%;
            height: 5px;
            background-color: #e2e8f0;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
        }

        /* Botones */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(58, 96, 115, 0.2);
        }

        .btn:hover {
            opacity: 0.92;
        }

        .btn-stop {
            background-color: var(--accent-color) !important;
            box-shadow: 0 4px 12px rgba(217, 83, 79, 0.2) !important;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-sub);
            border: 1px solid #cbd5e1;
            box-shadow: none;
            display: none;
        }

        .btn-secondary:hover {
            background-color: #f8fafc;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Regulación Somática</h1>
        <p class="subtitle">Práctica Guiada SRS</p>

        <div class="instruction-box">
            <div class="instruction" id="instructionText">Listo para iniciar</div>
            <div class="sub-instruction" id="subInstructionText">Presiona el botón para comenzar</div>
        </div>

        <div class="ball-wrapper">
            <div class="somatic-ball" id="somaticBall"></div>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="btn-group">
            <button class="btn" id="startBtn" onclick="toggleExercise()">Iniciar Ejercicio</button>
            <button class="btn btn-secondary" id="skipBtn" onclick="skipIntro()">Saltar Explicación Teórica</button>
        </div>
    </div>

    <script>
        const bgMusic = new Audio('Audios1/Audio9.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.2;

        const voiceAudios = {
            intro: new Audio('Audios1/Audio1.mp3'),
            practice: new Audio('Audios1/Audio2.mp3')
        };

        let isRunning = false;
        let currentAudio = null;
        let animationFrameId = null;

        const instructionText = document.getElementById('instructionText');
        const subInstructionText = document.getElementById('subInstructionText');
        const somaticBall = document.getElementById('somaticBall');
        const progressBar = document.getElementById('progressBar');
        const startBtn = document.getElementById('startBtn');
        const skipBtn = document.getElementById('skipBtn');

        /*
          LÍNEA DE TIEMPO EXTRAÍDA DEL AUDIO 2 EXACTO:
          - tipo: 'static' (fijo), 'squeeze' (apretar gradual), 'hold' (mantener apretado), 'release' (soltar gradual)
        */
        const TIMELINE = [
            { start: 0,   end: 5,   title: "Posición Inicial", sub: "Toma la pelota en tu mano dominante", type: "static", scale: 1.0 },
            { start: 5,   end: 9,   title: "Posición y Postura", sub: "Pies firmes en el suelo, espalda recta", type: "static", scale: 1.0 },
            { start: 9,   end: 17,  title: "INHALA Y APRIETA", sub: "Aprieta con fuerza la pelota...", type: "squeeze", scaleStart: 1.0, scaleEnd: 0.6 },
            { start: 17,  end: 22,  title: "SOSTÉN", sub: "Mantén la presión y retén la respiración", type: "hold", scale: 0.6 },
            { start: 22,  end: 30,  title: "EXHALA Y LIBERA", sub: "Suelta el aire y abre la mano muy despacio...", type: "release", scaleStart: 0.6, scaleEnd: 1.0 },
            
            { start: 30,  end: 37,  title: "INHALA Y APRIETA", sub: "Aprieta fuertemente otra vez...", type: "squeeze", scaleStart: 1.0, scaleEnd: 0.6 },
            { start: 37,  end: 49,  title: "SOSTÉN LA TENSIÓN", sub: "Siente la tensión en mano, antebrazo y hombro...", type: "hold", scale: 0.6 },
            { start: 49,  end: 56,  title: "EXHALA Y LIBERA", sub: "Libera la presión y el aire progresivamente...", type: "release", scaleStart: 0.6, scaleEnd: 1.0 },

            { start: 56,  end: 63,  title: "INHALA Y APRIETA", sub: "Tercera repetición: aprieta con fuerza...", type: "squeeze", scaleStart: 1.0, scaleEnd: 0.6 },
            { start: 63,  end: 70,  title: "SOSTÉN LA PRESIÓN", sub: "Siente el esfuerzo de tus músculos", type: "hold", scale: 0.6 },
            { start: 70,  end: 77,  title: "EXHALA Y LIBERA", sub: "Ve soltando la presión muy despacio...", type: "release", scaleStart: 0.6, scaleEnd: 1.0 },

            { start: 77,  end: 87,  title: "Siente la pelota", "sub": "Observa cómo recupera su forma en tu mano", type: "static", scale: 1.0 },
            { start: 87,  end: 97,  title: "Inhala Profundo", sub: "Llena tus pulmones lentamente...", type: "static", scale: 1.0 },
            { start: 97,  end: 104, title: "Exhala y Relaja", sub: "Mano completamente abierta...", type: "static", scale: 1.0 },
            { start: 104, end: 112, title: "Siente el Contraste", sub: "Nota el calor y la circulación en tus dedos", type: "static", scale: 1.0 },
            { start: 112, end: 120, title: "Respiración Suave", sub: "La respuesta de calma se ha activado", type: "static", scale: 1.0 },

            { start: 120, end: 135, title: "Rueda la Pelota", sub: "Pásala entre tus palmas, siente su textura...", type: "static", scale: 1.0 },
            { start: 135, end: 148, title: "Descarga Completada", sub: "Tu cuerpo ha regresado a una zona de seguridad", type: "static", scale: 1.0 },

            { start: 148, end: 153, title: "INHALAMOS", sub: "Toma aire una última vez...", type: "squeeze", scaleStart: 1.0, scaleEnd: 0.7 },
            { start: 153, end: 158, title: "SOSTENEMOS", sub: "Mantén un instante...", type: "hold", scale: 0.7 },
            { start: 158, end: 168, title: "LIBERAMOS", sub: "Exhala todo el aire y suelta por completo", type: "release", scaleStart: 0.7, scaleEnd: 1.0 },
            { start: 168, end: 175, title: "Ejercicio Completado", sub: "Control y calma restablecidos en ti", type: "static", scale: 1.0 }
        ];

        function toggleExercise() {
            if (isRunning) {
                stopExercise();
            } else {
                startExercise();
            }
        }

        function startExercise() {
            isRunning = true;
            startBtn.textContent = 'Detener Ejercicio';
            startBtn.classList.add('btn-stop');
            skipBtn.style.display = 'block';

            bgMusic.currentTime = 0;
            bgMusic.play().catch(e => console.warn(e));

            // Iniciar Audio 1
            playAudioSequence(voiceAudios.intro, "Fundamentación Somática", "Escucha las indicaciones teoricas...", () => {
                startPractice();
            });
        }

        function skipIntro() {
            if (!isRunning) return;
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.onended = null;
            }
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            startPractice();
        }

        function playAudioSequence(audioObj, title, subtitle, onEndedCallback) {
            if (!isRunning) return;

            currentAudio = audioObj;
            currentAudio.currentTime = 0;
            instructionText.textContent = title;
            subInstructionText.textContent = subtitle;
            somaticBall.style.transform = "scale(1)";

            currentAudio.play().catch(e => console.warn(e));

            function updateIntroProgress() {
                if (!isRunning || currentAudio !== audioObj) return;
                if (currentAudio.duration) {
                    progressBar.style.width = ((currentAudio.currentTime / currentAudio.duration) * 100) + "%";
                }
                if (!currentAudio.paused && !currentAudio.ended) {
                    animationFrameId = requestAnimationFrame(updateIntroProgress);
                }
            }
            animationFrameId = requestAnimationFrame(updateIntroProgress);

            currentAudio.onended = () => {
                if (isRunning && onEndedCallback) onEndedCallback();
            };
        }

        function startPractice() {
            skipBtn.style.display = 'none';
            currentAudio = voiceAudios.practice;
            currentAudio.currentTime = 0;

            currentAudio.play().catch(e => console.warn(e));

            // Bucle principal de animación ultra suave sincronizado con el audio
            function animatePractice() {
                if (!isRunning || currentAudio !== voiceAudios.practice) return;

                const t = currentAudio.currentTime;

                if (currentAudio.duration) {
                    progressBar.style.width = ((t / currentAudio.duration) * 100) + "%";
                }

                // Buscar el paso actual de la línea de tiempo
                const step = TIMELINE.find(s => t >= s.start && t < s.end) || TIMELINE[TIMELINE.length - 1];

                instructionText.textContent = step.title;
                subInstructionText.textContent = step.sub;

                // Calcular la escala exacta de la pelota según el tipo de acción
                let currentScale = 1.0;

                if (step.type === "static") {
                    currentScale = step.scale;
                } else if (step.type === "hold") {
                    // Pequeña pulsación tenue mientras se sostiene
                    const duration = step.end - step.start;
                    const elapsed = t - step.start;
                    const pulse = Math.sin((elapsed / duration) * Math.PI * 4) * 0.02;
                    currentScale = step.scale + pulse;
                } else if (step.type === "squeeze" || step.type === "release") {
                    // Transición GRADUAL y suave entre el inicio y el fin de la frase
                    const duration = step.end - step.start;
                    const elapsed = Math.max(0, Math.min(duration, t - step.start));
                    const progress = elapsed / duration; // Valor de 0.0 a 1.0
                    
                    currentScale = step.scaleStart + (step.scaleEnd - step.scaleStart) * progress;
                }

                // Aplicar la escala a la pelota en tiempo real
                somaticBall.style.transform = `scale(${currentScale.toFixed(3)})`;

                if (!currentAudio.paused && !currentAudio.ended) {
                    animationFrameId = requestAnimationFrame(animatePractice);
                }
            }

            currentAudio.onplay = () => {
                animationFrameId = requestAnimationFrame(animatePractice);
            };

            currentAudio.onended = () => {
                if (isRunning) {
                    instructionText.textContent = "Calma Restaurada";
                    subInstructionText.textContent = "Has completado tu sesión somática";
                    somaticBall.style.transform = "scale(1)";
                    setTimeout(stopExercise, 3000);
                }
            };
        }

        function stopExercise() {
            isRunning = false;

            bgMusic.pause();
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio.onended = null;
            }

            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            progressBar.style.width = "0%";
            somaticBall.style.transform = "scale(1)";
            instructionText.textContent = "Listo para iniciar";
            subInstructionText.textContent = "Presiona el botón para comenzar";
            startBtn.textContent = 'Iniciar Ejercicio';
            startBtn.classList.remove('btn-stop');
            skipBtn.style.display = 'none';
        }
    </script>
</body>
</html>
