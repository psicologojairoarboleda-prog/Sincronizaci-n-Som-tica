<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regulación Somática (SRS)</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #3b6e5f;
            --primary-light: #739e90;
            --accent-color: #c94a4a;
            --text-main: #2c3e35;
            --text-sub: #6c7a73;
            --ball-glow: rgba(59, 110, 95, 0.2);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 28px;
            padding: 35px 25px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-size: 1.25rem;
            letter-spacing: 0.5px;
            margin-top: 0;
            margin-bottom: 4px;
            color: var(--primary-color);
            text-transform: uppercase;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* Caja de instrucción clara */
        .instruction-box {
            min-height: 75px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .instruction {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--primary-color);
            line-height: 1.2;
            transition: opacity 0.2s ease;
        }

        .sub-instruction {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-top: 6px;
            font-style: italic;
            transition: opacity 0.2s ease;
        }

        /* ÁREA DE LA PELOTA SOMÁTICA */
        .ball-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 10px auto 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .somatic-ball {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #8abcb0, #3b6e5f 70%, #1d3830);
            box-shadow: 0 10px 25px var(--ball-glow);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), filter 0.5s ease;
            transform: scale(1);
            z-index: 2;
        }

        /* ESTADOS DE LA PELOTA */
        .ball-wrapper.squeeze .somatic-ball {
            transform: scale(0.65);
            filter: brightness(0.9);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .ball-wrapper.hold .somatic-ball {
            transform: scale(0.65);
            filter: brightness(0.95);
        }

        .ball-wrapper.release .somatic-ball {
            transform: scale(1.1);
            filter: brightness(1.05);
            box-shadow: 0 15px 30px var(--ball-glow);
        }

        /* Barra de progreso de audio */
        .progress-bar-container {
            width: 100%;
            height: 5px;
            background-color: #e6edea;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
            transition: width 0.1s linear;
        }

        /* BOTONES */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 110, 95, 0.2);
        }

        .btn:hover {
            opacity: 0.92;
        }

        .btn-stop {
            background-color: var(--accent-color) !important;
            box-shadow: 0 4px 12px rgba(201, 74, 74, 0.2) !important;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-sub);
            border: 1px solid #b8c7c2;
            box-shadow: none;
            display: none;
        }

        .btn-secondary:hover {
            background-color: #edf2f0;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Regulación Somática</h1>
        <p class="subtitle">Guía de Práctica SRS</p>

        <div class="instruction-box">
            <div class="instruction" id="instructionText">Listo para comenzar</div>
            <div class="sub-instruction" id="subInstructionText">Presiona iniciar ejercicio</div>
        </div>

        <div class="ball-wrapper" id="ballWrapper">
            <div class="somatic-ball" id="somaticBall"></div>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="btn-group">
            <button class="btn" id="startBtn" onclick="toggleExercise()">Iniciar Ejercicio</button>
            <button class="btn btn-secondary" id="skipBtn" onclick="skipIntro()">Saltar Explicación Teórica</button>
        </div>
    </div>

    <script>
        // Archivos de audio desde la carpeta Audios1/
        const bgMusic = new Audio('Audios1/Audio9.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.2;

        const voiceAudios = {
            intro: new Audio('Audios1/Audio1.mp3'),
            practice: new Audio('Audios1/Audio2.mp3')
        };

        let isRunning = false;
        let currentAudio = null;

        const instructionText = document.getElementById('instructionText');
        const subInstructionText = document.getElementById('subInstructionText');
        const ballWrapper = document.getElementById('ballWrapper');
        const progressBar = document.getElementById('progressBar');
        const startBtn = document.getElementById('startBtn');
        const skipBtn = document.getElementById('skipBtn');

        // LÍNEA DE TIEMPO AJUSTADA CON MARGEN DE RETARDO EXACTO (Audio 2)
        // Formato: [SegundoInicio, TítuloPrincipal, Subtítulo, AnimaciónPelota]
        const TIMELINE = [
            [0.0,  "Prepárate", "Toma la pelota en tu mano dominante", ""],
            [4.0,  "Posición Inicial", "Apoya los pies firmes y espalda recta", ""],
            [7.5,  "Inhala y Aprieta", "Aprieta con fuerza la pelota...", "squeeze"],
            [11.5, "Sostén", "Retén el aire y siente la tensión", "hold"],
            [14.5, "Exhala y Libera", "Suelta despacio y abre la mano...", "release"],
            [19.0, "Inhala y Aprieta", "Vuelve a presionar con fuerza...", "squeeze"],
            [22.5, "Sostén la tensión", "Antebrazo, hombro y mano...", "hold"],
            [28.0, "Deposita la ansiedad", "Toda la carga física ahí...", "hold"],
            [32.0, "Exhala y Libera", "Libera la presión lentamente...", "release"],
            [36.5, "Inhala y Aprieta", "Nueva presión firme...", "squeeze"],
            [40.0, "Sostén la presión", "Siente el esfuerzo en tus músculos", "hold"],
            [43.5, "Exhala y Libera", "Suelta el aire muy despacio...", "release"],
            [48.0, "Siente la pelota", "Nota cómo recupera su forma...", ""],
            [52.0, "Inhala profundo", "Llena tus pulmones de aire...", ""],
            [56.0, "Exhala y relaja", "Mano completamente abierta...", "release"],
            [61.0, "Siente el contraste", "Calor y circulación en tus dedos", ""],
            [65.0, "Respiración suave", "La calma se activa en tu cuerpo", ""],
            [69.0, "Exhala despacio", "Suelta cualquier resto de tensión", "release"],
            [73.0, "Cambia de mano", "Toma la pelota entre ambas palmas", ""],
            [77.0, "Rueda la pelota", "Siente su textura y temperatura", ""],
            [83.0, "El esfuerzo ha terminado", "Tu cuerpo regresa a una zona segura", ""],
            [89.0, "Inhala suave", "Control y calma establecidos...", "squeeze"],
            [92.5, "Sostén", "Interioriza la estabilidad", "hold"],
            [95.5, "Exhala", "Ejercicio completado con éxito", "release"]
        ];

        function toggleExercise() {
            if (isRunning) {
                stopExercise();
            } else {
                startExercise();
            }
        }

        function startExercise() {
            isRunning = true;
            startBtn.textContent = 'Detener Ejercicio';
            startBtn.classList.add('btn-stop');
            skipBtn.style.display = 'block';

            bgMusic.currentTime = 0;
            bgMusic.play().catch(e => console.warn("Música de fondo:", e));

            // Reproducir Audio 1 (Teoría)
            playAudioSequence(voiceAudios.intro, "Fundamentación Somática", "Escucha las indicaciones previas...", () => {
                startPractice();
            });
        }

        function skipIntro() {
            if (!isRunning) return;
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.onended = null;
                currentAudio.ontimeupdate = null;
            }
            startPractice();
        }

        function playAudioSequence(audioObj, title, subtitle, onEndedCallback) {
            if (!isRunning) return;

            currentAudio = audioObj;
            currentAudio.currentTime = 0;
            instructionText.textContent = title;
            subInstructionText.textContent = subtitle;
            setBallState("");

            currentAudio.play().catch(e => console.warn("Error audio:", e));

            currentAudio.ontimeupdate = () => {
                if (currentAudio.duration) {
                    progressBar.style.width = ((currentAudio.currentTime / currentAudio.duration) * 100) + "%";
                }
            };

            currentAudio.onended = () => {
                if (isRunning && onEndedCallback) onEndedCallback();
            };
        }

        function startPractice() {
            skipBtn.style.display = 'none';
            currentAudio = voiceAudios.practice;
            currentAudio.currentTime = 0;

            currentAudio.play().catch(e => console.warn("Error práctica:", e));

            // Sincronización estricta por segundo de reproducción
            currentAudio.ontimeupdate = () => {
                if (!isRunning) return;

                const t = currentAudio.currentTime;

                if (currentAudio.duration) {
                    progressBar.style.width = ((t / currentAudio.duration) * 100) + "%";
                }

                // Encontrar exactamente en qué bloque de tiempo estamos
                let activeStep = TIMELINE[0];
                for (let i = 0; i < TIMELINE.length; i++) {
                    if (t >= TIMELINE[i][0]) {
                        activeStep = TIMELINE[i];
                    } else {
                        break;
                    }
                }

                // Actualizar pantalla y animación de forma fluida
                if (instructionText.textContent !== activeStep[1]) {
                    instructionText.textContent = activeStep[1];
                    subInstructionText.textContent = activeStep[2];
                    setBallState(activeStep[3]);
                }
            };

            currentAudio.onended = () => {
                if (isRunning) {
                    instructionText.textContent = "Calma Restaurada";
                    subInstructionText.textContent = "Has completado tu sesión somática";
                    setBallState("");
                    setTimeout(stopExercise, 3500);
                }
            };
        }

        function setBallState(state) {
            ballWrapper.className = "ball-wrapper";
            if (state) {
                ballWrapper.classList.add(state);
            }
        }

        function stopExercise() {
            isRunning = false;

            bgMusic.pause();
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio.onended = null;
                currentAudio.ontimeupdate = null;
            }

            progressBar.style.width = "0%";
            setBallState("");
            instructionText.textContent = "Listo para comenzar";
            subInstructionText.textContent = "Presiona iniciar ejercicio";
            startBtn.textContent = 'Iniciar Ejercicio';
            startBtn.classList.remove('btn-stop');
            skipBtn.style.display = 'none';
        }
    </script>
</body>
</html>
