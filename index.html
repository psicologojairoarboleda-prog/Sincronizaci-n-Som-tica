<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regulación Somática (SRS)</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --primary-color: #4a7c59;
            --primary-light: #8fc0a9;
            --accent-color: #d9534f;
            --text-main: #2b3a42;
            --text-sub: #687f8a;
            --ball-glow: rgba(74, 124, 89, 0.25);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 28px;
            padding: 35px 25px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-size: 1.3rem;
            letter-spacing: 0.5px;
            margin-top: 0;
            margin-bottom: 4px;
            color: var(--primary-color);
            text-transform: uppercase;
        }

        p.subtitle {
            font-size: 0.88rem;
            color: var(--text-sub);
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Indicador de instrucción principal */
        .instruction-box {
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .instruction {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-color);
            transition: all 0.4s ease;
        }

        .sub-instruction {
            font-size: 0.92rem;
            color: var(--text-sub);
            margin-top: 4px;
            font-style: italic;
            transition: all 0.4s ease;
        }

        /* ÁREA DE LA PELOTA SOMÁTICA CON ONDAS RELAJANTES */
        .ball-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 15px auto 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pulse-ring {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px solid var(--primary-light);
            opacity: 0;
            transition: all 0.5s ease;
        }

        .somatic-ball {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #9ec7ad, #4a7c59 70%, #2b4c35);
            box-shadow: 0 10px 25px var(--ball-glow);
            transition: transform 0.6s ease-in-out, filter 0.6s ease, box-shadow 0.6s ease;
            transform: scale(1);
            z-index: 2;
        }

        /* ANIMACIONES REACCIONANDO AL AUDIO */
        /* Estado: Inhala y Aprieta la pelota */
        .ball-wrapper.squeeze .somatic-ball {
            transform: scale(0.68);
            filter: brightness(0.9);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* Estado: Sostén la presión */
        .ball-wrapper.hold .somatic-ball {
            transform: scale(0.68);
            animation: inner-pulse 1.2s infinite alternate ease-in-out;
        }

        /* Estado: Exhala y Libera */
        .ball-wrapper.release .somatic-ball {
            transform: scale(1.08);
            filter: brightness(1.08);
            box-shadow: 0 15px 30px var(--ball-glow);
        }

        .ball-wrapper.release .pulse-ring {
            animation: ring-expand 2s infinite ease-out;
        }

        @keyframes inner-pulse {
            0% { transform: scale(0.68); }
            100% { transform: scale(0.72); }
        }

        @keyframes ring-expand {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.45); opacity: 0; }
        }

        /* Barra de progreso visual */
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: #e2e8f0;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
            transition: width 0.2s linear;
        }

        /* BOTONES */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 30px;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(74, 124, 89, 0.2);
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-stop {
            background-color: var(--accent-color) !important;
            box-shadow: 0 4px 12px rgba(217, 83, 79, 0.2) !important;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-sub);
            border: 1px solid #cbd5e1;
            box-shadow: none;
            display: none;
        }

        .btn-secondary:hover {
            background-color: #f8fafc;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Regulación Somática</h1>
        <p class="subtitle">Sincronización SRS con Pelota Antiestrés</p>

        <div class="instruction-box">
            <div class="instruction" id="instructionText">Bienvenido</div>
            <div class="sub-instruction" id="subInstructionText">Presiona iniciar para comenzar</div>
        </div>

        <div class="ball-wrapper" id="ballWrapper">
            <div class="pulse-ring"></div>
            <div class="somatic-ball" id="somaticBall"></div>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="btn-group">
            <button class="btn" id="startBtn" onclick="toggleExercise()">Iniciar Ejercicio</button>
            <button class="btn btn-secondary" id="skipBtn" onclick="skipIntro()">Saltar Explicación Teórica</button>
        </div>
    </div>

    <script>
        // Fuentes de audio desde la carpeta Audios1/
        const bgMusic = new Audio('Audios1/Audio9.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.2;

        const voiceAudios = {
            intro: new Audio('Audios1/Audio1.mp3'),
            practice: new Audio('Audios1/Audio2.mp3')
        };

        let isRunning = false;
        let currentAudio = null;

        const instructionText = document.getElementById('instructionText');
        const subInstructionText = document.getElementById('subInstructionText');
        const ballWrapper = document.getElementById('ballWrapper');
        const progressBar = document.getElementById('progressBar');
        const startBtn = document.getElementById('startBtn');
        const skipBtn = document.getElementById('skipBtn');

        // MAPA DE EVENTOS BASADO EN EL TIMECODE REAL DE AUDIO2.MP3
        // Formato: [TiempoSegundos, TextoPrincipal, TextoSecundario, EstadoPelota]
        const TIMELINE = [
            [0.0,  "Prepárate", "Toma la pelota con fuerza en tu mano dominante", ""],
            [3.5,  "Espalda recta y pies en el suelo", "Pon toda tu atención en el objeto", ""],
            [6.8,  "INHALA Y APRIETA", "1... 2... 3... 4...", "squeeze"],
            [9.8,  "SOSTÉN", "Siente la tensión en tu mano", "hold"],
            [12.5, "EXHALA Y LIBERA", "1... 2... 3... 4... Abre la mano", "release"],
            [17.0, "INHALA Y APRIETA", "1... 2... 3... 4...", "squeeze"],
            [19.8, "SOSTÉN LA TENSIÓN", "Mano, antebrazo y hombro...", "hold"],
            [23.5, "Deposita la ansiedad ahí", "Carga toda la fuerza en la pelota", "hold"],
            [27.5, "EXHALA Y LIBERA", "1... 2... 3... 4...", "release"],
            [32.0, "HAZ PRESIÓN E INHALA", "1... 2... 3... 4...", "squeeze"],
            [35.5, "SOSTÉN LA PRESIÓN", "Siente el esfuerzo muscular", "hold"],
            [38.5, "EXHALA Y LIBERA DESPACIO", "1... 2... 3... 4...", "release"],
            [43.0, "Siente la pelota", "Recupera su forma mientras tomas aire...", "release"],
            [47.5, "INHALA PROFUNDO", "1... 2... 3... 4...", ""],
            [51.5, "Mano abierta y relajada", "EXHALA: 1... 2... 3... 4...", "release"],
            [56.5, "Siente el contraste", "Calor y circulación en tus dedos", ""],
            [60.0, "Respiración suave", "La calma se está activando...", ""],
            [63.0, "Exhala despacio", "Suelta cualquier tensión restante", "release"],
            [67.5, "Cambia de mano si deseas", "Toma la pelota entre ambas palmas", ""],
            [71.5, "Hazla rodar suavemente", "Siente el contacto, textura y temperatura", ""],
            [77.0, "El esfuerzo ha terminado", "Tu cuerpo regresa a una zona de seguridad", ""],
            [83.0, "INHALAMOS", "1... 2... 3...", "squeeze"],
            [86.0, "SOSTENEMOS", "Siente la estabilidad", "hold"],
            [88.5, "LIBERAMOS", "Exhala todo el aire...", "release"],
            [94.0, "Ejercicio Completado", "Control y calma restaurados", ""]
        ];

        function toggleExercise() {
            if (isRunning) {
                stopExercise();
            } else {
                startExercise();
            }
        }

        function startExercise() {
            isRunning = true;
            startBtn.textContent = 'Detener Ejercicio';
            startBtn.classList.add('btn-stop');
            skipBtn.style.display = 'block';

            bgMusic.currentTime = 0;
            bgMusic.play().catch(e => console.warn("Música de fondo:", e));

            // Paso 1: Reproducir Explicación Teórica (Audio 1)
            playAudioSequence(voiceAudios.intro, "Fundamentación Somática", "Escucha las indicaciones previas...", () => {
                // Paso 2: Al terminar Audio 1, iniciar el ejercicio práctico (Audio 2)
                startPractice();
            });
        }

        function skipIntro() {
            if (!isRunning) return;
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.onended = null;
                currentAudio.ontimeupdate = null;
            }
            startPractice();
        }

        function playAudioSequence(audioObj, title, subtitle, onEndedCallback) {
            if (!isRunning) return;

            currentAudio = audioObj;
            currentAudio.currentTime = 0;
            instructionText.textContent = title;
            subInstructionText.textContent = subtitle;
            setBallState("");

            currentAudio.play().catch(e => console.warn("Error al reproducir voz:", e));

            currentAudio.ontimeupdate = () => {
                if (currentAudio.duration) {
                    const pct = (currentAudio.currentTime / currentAudio.duration) * 100;
                    progressBar.style.width = pct + "%";
                }
            };

            currentAudio.onended = () => {
                if (isRunning && onEndedCallback) onEndedCallback();
            };
        }

        function startPractice() {
            skipBtn.style.display = 'none';
            currentAudio = voiceAudios.practice;
            currentAudio.currentTime = 0;

            currentAudio.play().catch(e => console.warn("Error al reproducir práctica:", e));

            // Sincronización continua exacta vinculada al evento 'timeupdate' del propio reproductor
            currentAudio.ontimeupdate = () => {
                if (!isRunning) return;

                const currentTime = currentAudio.currentTime;

                // Actualizar barra de progreso
                if (currentAudio.duration) {
                    progressBar.style.width = ((currentTime / currentAudio.duration) * 100) + "%";
                }

                // Buscar la instrucción más cercana en la línea de tiempo
                for (let i = TIMELINE.length - 1; i >= 0; i--) {
                    if (currentTime >= TIMELINE[i][0]) {
                        instructionText.textContent = TIMELINE[i][1];
                        subInstructionText.textContent = TIMELINE[i][2];
                        setBallState(TIMELINE[i][3]);
                        break;
                    }
                }
            };

            currentAudio.onended = () => {
                if (isRunning) {
                    instructionText.textContent = "Calma Restaurada";
                    subInstructionText.textContent = "Puedes repetir el ejercicio cuando lo necesites";
                    setBallState("");
                    setTimeout(stopExercise, 3000);
                }
            };
        }

        function setBallState(state) {
            ballWrapper.className = "ball-wrapper";
            if (state) {
                ballWrapper.classList.add(state);
            }
        }

        function stopExercise() {
            isRunning = false;

            bgMusic.pause();
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio.onended = null;
                currentAudio.ontimeupdate = null;
            }

            progressBar.style.width = "0%";
            setBallState("");
            instructionText.textContent = "Bienvenido";
            subInstructionText.textContent = "Presiona iniciar para comenzar";
            startBtn.textContent = 'Iniciar Ejercicio';
            startBtn.classList.remove('btn-stop');
            skipBtn.style.display = 'none';
        }
    </script>
</body>
</html>
